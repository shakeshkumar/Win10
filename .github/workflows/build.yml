name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q Win10Android.zip
      - run: cd Win10Android && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Win10Android-apk
          path: Win10Android/app/build/outputs/apk/debug/app-debug.apk
